<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用统计说明 · ENCHIN 来玩一会儿</title><style>body{max-width:42rem;margin:3rem auto;padding:0 1.25rem;font:16px/1.75 system-ui,sans-serif;color:#292940;background:#f8f7fd}h1{font-size:1.7rem}a{color:#645497}</style></head><body><h1>使用统计说明</h1><p>为了知道游戏是否顺畅、哪些关卡需要改进，公开网页版会在腾讯云记录打开游戏、关卡编号与尝试／完成、自由游戏开始与胜负、点击保存纪念卡，以及手机系统确认分享后的匿名事件。</p><p>浏览器会保存一个随机编号，用来估算独立访问浏览器和复访。我们不把昵称、祝福、意见、卡片文字、分数或完整游戏存档上传到统计表；不会用编号识别你的真实身份。清除本站浏览器数据后会生成新编号，因此人数是浏览器估算值，不等于真实人数。</p><p>祝福与意见由飞书表单单独收集。祝福只有经作者确认后才公开；意见只供作者查看。审核预览模式不记录统计。</p><p><a href="index.html">返回游戏</a></p></body></html>
